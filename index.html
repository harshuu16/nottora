    <!-- Favicon & App Icons (Official Nottora Brand Identity) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1C1917" />
    <meta name="color-scheme" content="light dark" />

    <!-- OpenGraph Social Metadata -->
    <meta property="og:title" content="Nottora — Your Notes. Organized for Study." />
    <meta property="og:description" content="Digital academic library and study repository for college students to discover, organize, and study notes, important questions, PYQs, and lab manuals." />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nottora — Your Notes. Organized for Study." />
    <meta name="twitter:description" content="Digital academic library and study repository for college students to discover, organize, and study notes, important questions, PYQs, and lab manuals." />
    <meta name="twitter:image" content="https://nottora.vercel.app/favicon-512x512.png" />

    <!-- Google Search Site Name & Structured Data -->
    <script id="seo-structured-data" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Nottora",
        "alternateName": [
          "Nottora Notes",
          "Nottora Academic Library",
          "Nottora App"
        ],
        "url": "https://nottora.vercel.app/",
        "description": "Digital academic library and study repository for college students to discover, organize, and study notes, important questions, PYQs, and lab manuals.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://nottora.vercel.app/?search={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('nottora-theme-preference');
          var isDark = stored === 'dark';
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&family=JetBrains+Mono:wght@400;500&display=swap" crossorigin="anonymous">
  </head>
  <body class="bg-[#FBF9F5] text-[#1C1917] antialiased selection:bg-[#EA580C]/20 selection:text-[#9A3412]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
